name: Nightly 1 A.M. Paper

on:
  schedule:
    - cron: "52 0 * * *"            # 12:52 AM every night
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = make an issue now · check = test the paper search only (no model calls, nothing published)"
        type: choice
        options: [full, check]
        default: full

permissions:
  contents: write    # commit the new issue and log
  pages: write       # publish the site
  id-token: write    # required by the Pages deploy action

concurrency:
  group: one-am-paper
  cancel-in-progress: false

jobs:
  issue:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Find the site address
        id: pages
        uses: actions/configure-pages@v5

      - name: Make tonight's issue
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          READER_PROFILE: ${{ secrets.READER_PROFILE }}
          MODE: ${{ inputs.mode || 'full' }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 run.py

      - name: Save the issue and log to the repository
        if: (inputs.mode || 'full') == 'full'
        run: |
          if [ "$(jq -r .status run_summary.json)" != "made" ]; then echo "Nothing new to save."; exit 0; fi
          git config user.name "1am-paper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Issue No. $(jq -r .no run_summary.json)"
          git push

      - name: Package the site
        if: (inputs.mode || 'full') == 'full'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Publish the site
        id: deployment
        if: (inputs.mode || 'full') == 'full'
        uses: actions/deploy-pages@v4

      - name: Send the phone notification
        if: (inputs.mode || 'full') == 'full'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ] || [ "$(jq -r .status run_summary.json)" != "made" ]; then exit 0; fi
          URL=$(jq -r .url run_summary.json)
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$URL")" = "200" ] && break
            sleep 10
          done
          jq -n --arg topic "$NTFY_TOPIC" --arg url "$URL" \
                --arg title "$(jq -r .title run_summary.json)" \
                --arg msg "$(jq -r .message run_summary.json)" \
                '{topic:$topic, title:$title, message:$msg, click:$url, tags:["crescent_moon"],
                  actions:[{action:"view", label:"Read it", url:$url}]}' \
          | curl -s -X POST -H "Content-Type: application/json" --data-binary @- https://ntfy.sh

      - name: Alert if something broke
        if: failure() && github.event_name == 'schedule'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$NTFY_TOPIC" ] && exit 0
          jq -n --arg topic "$NTFY_TOPIC" --arg url "$RUN_URL" \
                '{topic:$topic, title:"1 A.M. Paper failed tonight", message:"Tap to see the run log.",
                  click:$url, tags:["warning"]}' \
          | curl -s -X POST -H "Content-Type: application/json" --data-binary @- https://ntfy.sh
